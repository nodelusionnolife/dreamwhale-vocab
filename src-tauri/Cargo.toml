[package]
name = "dreamwhale-vocab"
version = "0.15.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
windows = { version = "0.62.2", features = ["Media_SpeechSynthesis", "Media_Core", "Storage_Streams", "Win32_System_WinRT"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

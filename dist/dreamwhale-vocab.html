<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>梦鲸词汇 · 鲸鱼娘对话副本</title>
<style>
  :root {
    --bg: #14161d; --panel: #1d2129; --panel-2: #262b35; --line: #333a47;
    --fg: #eef1f6; --muted: #9aa4b4; --accent: #6ea8fe;
    --ok: #4ec9a0; --bad: #f0736f; --warn: #e0b184;
    --tile: #2f3644; --tile-sel: #3d5a8a;
    --env: #7fb3d5; --action: #c9a0dc; --thought: #e0b184; --speech: #9fe0b8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: ui-rounded, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100dvh; display: flex; flex-direction: column;
  }
  /* 对话模式：把 body 高度锁死在视口，滚轮才会落在对话区内部而不是整页。
     只设 min-height 的话，内容一高 body 就跟着长，内层容器永远撑到内容高度，
     overflow-y: auto 就形同虚设。拼单词模式仍走整页滚动，所以用类名限定作用域。 */
  body.chat-mode { height: 100dvh; overflow: hidden; }
  header {
    display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    font-size: 13px; color: var(--muted); position: sticky; top: 0;
    background: var(--bg); z-index: 5;
  }
  header b { color: var(--fg); font-weight: 800; }
  header b.warn { color: var(--warn); }
  header b.bad { color: var(--bad); }
  header b.resting { color: var(--ok); }
  header .spacer { flex: 1; }
  button {
    font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--fg); padding: 8px 12px;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0d1220; font-weight: 800; }
  button.ghost { background: transparent; }

  /* ---------- 对话模式 ---------- */
  #view-chat { flex: 1; display: flex; min-height: 0; }
  #session-side {
    width: 232px; flex: none; border-right: 1px solid var(--line);
    background: #171a21; overflow-y: auto; overscroll-behavior: contain;
  }
  #chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .side-head {
    display: flex; align-items: center; gap: 8px; padding: 12px;
    border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #171a21;
  }
  .side-title { flex: 1; font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
  .side-new { padding: 5px 9px; font-size: 12px; }
  .side-empty { padding: 20px 12px; color: var(--muted); font-size: 12px; text-align: center; }
  .side-item { display: flex; align-items: stretch; border-bottom: 1px solid #22262f; }
  .side-item.active { background: #202634; box-shadow: inset 3px 0 0 var(--accent); }
  .side-main {
    flex: 1; min-width: 0; text-align: left; background: transparent; border: 0;
    border-radius: 0; padding: 10px 6px 10px 12px;
  }
  .side-item-title {
    font-size: 13px; font-weight: 700; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .side-item-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .side-del {
    flex: none; width: 30px; background: transparent; border: 0; border-radius: 0;
    color: var(--muted); font-size: 15px; padding: 0;
  }
  .side-del:hover { color: var(--bad); }
  .side-confirm { display: flex; align-items: center; gap: 4px; padding: 0 8px; font-size: 11px; color: var(--bad); }
  .side-confirm-yes, .side-confirm-no { padding: 4px 6px; font-size: 11px; }
  .side-confirm-yes { border-color: var(--bad); color: var(--bad); background: transparent; }
  #chat-thread {
    flex: 1; overflow-y: auto; overscroll-behavior: contain;
    width: min(100%, 780px); margin: 0 auto; padding: 18px 14px 8px;
  }
  .msg { margin-bottom: 18px; position: relative; }
  .msg-del { position: absolute; top: 0; right: 0; opacity: 0; transition: opacity .15s; }
  .msg:hover .msg-del, .msg-del:focus-within { opacity: 1; }
  .msg.user .msg-del { right: auto; left: 0; }
  .msg-del-btn {
    width: 24px; height: 24px; padding: 0; font-size: 13px; line-height: 1;
    background: var(--panel-2); color: var(--muted); border-radius: 8px;
  }
  .msg-del-confirm {
    display: flex; align-items: center; gap: 4px; padding: 3px 6px;
    background: var(--panel-2); border: 1px solid var(--bad); border-radius: 8px;
    font-size: 11px; color: var(--bad); white-space: nowrap;
  }
  .msg-del-yes, .msg-del-no { padding: 2px 6px; font-size: 11px; }
  .msg-del-yes { border-color: var(--bad); color: var(--bad); background: transparent; }
  /* 窄屏：侧栏收起为抽屉，用表头按钮切换 */
  @media (max-width: 860px) {
    #session-side { position: absolute; z-index: 8; height: 100%; transform: translateX(-100%); transition: transform .2s; }
    #view-chat.side-open #session-side { transform: none; box-shadow: 12px 0 32px rgba(0,0,0,.5); }
    #view-chat { position: relative; overflow: hidden; }
  }
  .msg-who { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .msg.user { text-align: right; }
  .msg.user .msg-who { text-align: right; }
  .msg-body { display: inline-block; text-align: left; max-width: 100%; }
  .msg.assistant .msg-body {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px;
  }
  .msg.user .msg-body {
    background: #2b3a52; border: 1px solid #35496a;
    border-radius: 14px; padding: 10px 13px;
  }
  .msg-body .para { margin: 0 0 10px; line-height: 1.9; font-size: 15px; white-space: pre-wrap; }
  .msg-body .para:last-child { margin-bottom: 0; }
  .seg-env { color: var(--env); }
  .seg-action { color: var(--action); }
  .seg-thought { color: var(--thought); }
  .seg-speech { color: var(--speech); }
  .qcard {
    margin: 12px 0; border: 1px solid var(--accent); border-left-width: 4px;
    border-radius: 12px; background: #1b2431; padding: 12px 14px;
  }
  .qcard-label { font-size: 11px; letter-spacing: .1em; color: var(--accent); font-weight: 800; margin-bottom: 8px; }
  .qcard-line { font-size: 15px; line-height: 1.8; }
  .msg-usage {
    margin-top: 5px; font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums; letter-spacing: .02em;
  }
  .msg.user .msg-usage { text-align: right; }
  .usage-absent { text-align: center; color: var(--muted); font-size: 12px; padding: 10px 0; }
  .regen-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin: 4px 0 14px; padding: 10px 12px;
    border: 1px dashed var(--warn); border-radius: 12px;
    background: #2a2418;
  }
  .regen-text { flex: 1; min-width: 200px; color: var(--warn); font-size: 12px; line-height: 1.6; }
  .regen-btn {
    border-color: var(--warn); color: var(--warn);
    background: transparent; font-weight: 800;
  }
  .chat-empty { color: var(--muted); text-align: center; padding: 40px 10px; line-height: 1.9; }
  .chat-empty .muted { font-size: 13px; }
  .thinking-dot { color: var(--muted); }
  #chat-composer {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
  }
  .composer-inner { width: min(100%, 780px); margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  #chat-input {
    flex: 1; min-height: 46px; max-height: 160px; resize: vertical;
    padding: 12px 13px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--fg); font: inherit; line-height: 1.6;
  }
  #btn-chat-send { min-height: 46px; padding: 0 20px; }
  /* 对话区背景：整场一张底图。cover 铺满、不变形、不重复；位置靠上，
     因为底图是竖幅全身像，靠上才留得住脸。
     图上压两层：先按比例压暗，再叠一层从上到下加深的渐变。
     底图很亮，不做这两层，12px 的灰色小字（发言人、空状态提示）就糊在图里；
     正文不受影响——消息气泡本身就是不透明面板，与底图亮暗无关。 */
  #chat-main { position: relative; }
  #chat-main::before {
    content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-image: var(--chat-bg, none);
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
    opacity: .62;
  }
  #chat-main::after {
    content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(20,22,29,.60), rgba(20,22,29,.72) 45%, rgba(20,22,29,.88));
  }
  #chat-thread, #chat-composer { position: relative; z-index: 1; }
  /* 发言人名直接压在底图上，而底图某些区域（比如裙子的白色）非常亮。
     只靠投影在 12px 小字上不够用——给一层半透明底，文字就与底图亮暗无关了。 */
  .msg-who {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    background: rgba(16,18,24,.62);
    text-shadow: 0 1px 4px rgba(0,0,0,.95);
  }
  .chat-empty { text-shadow: 0 1px 4px rgba(0,0,0,.95), 0 0 14px rgba(0,0,0,.7); }
  /* 表情包：贴在角色气泡里，随宽度等比缩放，绝不撑破气泡。
     写法上只定宽、高度 auto——替换元素在 max-width 生效时会按比例回算高度；
     反过来「定高 + 百分比 max-width」会把方形图压成非等比，contain 再补出透明边。 */
  .face-sticker {
    display: block; margin-top: 10px;
    width: 132px; height: auto; max-width: 100%;
    border-radius: 12px;
    background: rgba(0,0,0,.18);
  }
  .face-sticker-note { margin: 10px 0 0; font-size: 11px; color: var(--muted); }
  @media (max-width: 860px) {
    .face-sticker { width: 104px; }
  }

  /* ---------- 拼单词模式（保留） ---------- */
  main { flex: 1; width: min(100%, 1180px); margin: 0 auto; padding: 14px 14px 28px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .panes { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 14px; }
  @media (min-width: 900px) { .panes { grid-template-columns: 1fr 1fr; } }
  .pane { display: flex; flex-direction: column; min-height: 0; }
  .pane > h2 { margin: 0 0 10px; font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  .pane-body { flex: 1; min-height: 0; max-height: 46vh; overflow-y: auto; overscroll-behavior: contain; padding-right: 6px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tag { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
  .tag.hot { background: #3a2f22; color: var(--warn); }
  .scene { font-size: 15px; line-height: 1.95; white-space: pre-wrap; text-align: justify; }
  .objective { margin-top: 12px; font-weight: 800; color: var(--accent); }
  .objective span { color: var(--muted); font-weight: 500; font-size: 13px; }
  .narrative { font-size: 15px; line-height: 1.95; white-space: pre-wrap; text-align: justify; }
  .placeholder { color: var(--muted); font-size: 14px; line-height: 1.8; }
  .verdict-title { font-size: 15px; font-weight: 800; margin-bottom: 8px; }
  .verdict-pane.ok .verdict-title { color: var(--ok); }
  .verdict-pane.bad .verdict-title { color: var(--bad); }
  .feedback { margin: 10px 0 4px; font-weight: 700; font-size: 14px; }
  .meta { color: var(--muted); font-size: 12px; margin: 4px 0 0; line-height: 1.7; }
  .verdict-pane.ok > h2 { color: var(--ok); }
  .verdict-pane.bad > h2 { color: var(--bad); }
  .verdict-pane.ok .feedback { color: var(--ok); }
  .verdict-pane.bad .feedback { color: var(--bad); }
  .wordline {
    min-height: 52px; display: flex; align-items: center; gap: 6px;
    padding: 10px 12px; margin-bottom: 12px; background: var(--panel-2);
    border: 1px dashed var(--line); border-radius: 12px;
    font-size: 26px; letter-spacing: 4px; font-weight: 800;
  }
  .wordline.empty { color: var(--muted); font-size: 14px; letter-spacing: 1px; font-weight: 500; }
  .tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .tile {
    width: 46px; height: 52px; font-size: 22px; font-weight: 800;
    display: grid; place-items: center; background: var(--tile);
    border: 1px solid var(--line); border-radius: 10px; text-transform: lowercase;
  }
  .tile.sel { background: var(--tile-sel); border-color: var(--accent); opacity: .55; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .hidden { display: none !important; }
  #gameover { border-color: var(--bad); }
  #gameover h2 { margin: 0 0 8px; color: var(--bad); font-size: 17px; }

  /* ---------- 提示与弹窗 ---------- */
  #toast, #chat-toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: #2b3340; border: 1px solid var(--line); color: var(--fg);
    padding: 10px 16px; border-radius: 12px; font-size: 13px; max-width: 92vw;
    z-index: 20; box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  #chat-toast { bottom: 92px; }
  #toast.err, #chat-toast.err { border-color: var(--bad); color: #ffd9d7; }
  dialog {
    border: 1px solid var(--line); border-radius: 16px; background: var(--panel);
    color: var(--fg); width: min(94vw, 520px); padding: 18px;
  }
  dialog::backdrop { background: rgba(8,10,16,.72); }
  dialog h2 { margin: 0 0 4px; font-size: 17px; }
  dialog p.hint { margin: 0 0 14px; color: var(--muted); font-size: 12px; line-height: 1.6; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 11px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); font: inherit;
  }
  table.stats { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.stats th, table.stats td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; }
  table.stats th:first-child, table.stats td:first-child { text-align: left; }
  table.stats th { color: var(--muted); font-weight: 600; font-size: 12px; }
  table.stats tr.active td { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
  <header>
    <span id="hud-chat-group">
      模式 <b id="hud-chat-mode">对话</b>
      　角色回复 <b id="hud-chat-turns">0</b>
      　距下题 <b id="hud-chat-until">3</b>
      　<b id="hud-chat-rest">本周期已出 0/10 题</b>
      　累计 token <b id="hud-chat-tokens">—</b>
    </span>
    <span id="hud-wordblade-group" class="hidden">
      场景 <b id="hud-scene">1</b>
      　输出轮数 <b id="hud-turns">0</b>
      　通过挑战 <b id="hud-passed">0</b>
      　失败 <b id="hud-fail">0</b>
      　万能词 <b id="hud-wildcard">0</b>
      　<span id="hud-difficulty">普通</span>
      　<span id="hud-tier">基础</span>
    </span>
    <span class="spacer"></span>
    <button id="btn-side" class="ghost hidden">对话列表</button>
    <button id="btn-profile" class="ghost">档案</button>
    <button id="btn-stats" class="ghost">统计</button>
    <button id="btn-settings" class="ghost">设置</button>
  </header>

  <!-- ============ 对话模式 ============ -->
  <section id="view-chat">
    <aside id="session-side"><div id="session-list"></div></aside>
    <div id="chat-main">
      <div id="chat-thread"></div>
      <div id="chat-composer">
        <div class="composer-inner">
          <textarea id="chat-input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button id="btn-chat-send" class="primary">发送</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 拼单词模式（保留，可在设置里切回） ============ -->
  <main id="view-wordblade" class="hidden">
    <section class="panes">
      <article class="card pane scene-pane">
        <h2>挑战场景</h2>
        <div class="pane-body">
          <div class="tags">
            <span class="tag" id="tag-mode">应对</span>
            <span class="tag" id="tag-shell">日常</span>
            <span class="tag hot hidden" id="tag-meme"></span>
          </div>
          <div class="scene" id="scene-text">正在抽词与出题…</div>
          <div class="objective hidden" id="scene-objective">
            <span>挑战目标：</span><em id="objective-text"></em>
          </div>
        </div>
      </article>

      <article class="card pane verdict-pane" id="verdict-card">
        <h2>应对叙事</h2>
        <div class="pane-body">
          <div class="verdict-title hidden" id="verdict-title"></div>
          <div class="narrative placeholder" id="verdict-narrative">你的应对会接着挑战场景写在这里。</div>
          <p class="feedback hidden" id="verdict-feedback"></p>
          <p class="meta" id="verdict-detail"></p>
        </div>
      </article>
    </section>

    <section class="card hidden" id="gameover">
      <h2>本局结束</h2>
      <p class="meta" id="gameover-text"></p>
      <div class="actions" style="margin-top:12px">
        <button id="btn-restart" class="primary">重新开始</button>
        <button id="btn-stats-2" class="ghost">查看统计</button>
      </div>
    </section>

    <section class="card">
      <div class="wordline empty" id="wordline">点击下方字母拼出一个单词</div>
      <div class="tiles" id="tiles"></div>
      <div class="actions">
        <button id="btn-undo">撤销</button>
        <button id="btn-clear">清空</button>
        <button id="btn-dice">骰子 · 重抽</button>
        <button id="btn-wildcard">万能词</button>
        <button id="btn-submit" class="primary">确定</button>
      </div>
    </section>
  </main>

  <div id="toast" class="hidden"></div>
  <div id="chat-toast" class="hidden"></div>

  <!-- ============ user 档案 ============ -->
  <dialog id="profile-dialog">
    <h2>先认识一下</h2>
    <p class="hint">这是给鲸鱼娘看的档案。她会按你希望的方式称呼你。</p>
    <div class="field">
      <label for="pf-name">你希望鲸鱼娘如何称呼你</label>
      <input id="pf-name" placeholder="比如：阿澈" maxlength="20" autocomplete="off" />
    </div>
    <div class="field">
      <label for="pf-gender">性别</label>
      <select id="pf-gender">
        <option value="男">男</option>
        <option value="女">女</option>
        <option value="自定义">自定义</option>
      </select>
    </div>
    <div class="field hidden" id="pf-custom-wrap">
      <label for="pf-custom">自定义性别</label>
      <input id="pf-custom" placeholder="写你希望的叫法" maxlength="20" autocomplete="off" />
    </div>
    <p class="hint" id="pf-error"></p>
    <div class="actions">
      <button id="btn-pf-save" class="primary">开始对话</button>
    </div>
  </dialog>

  <!-- ============ 设置 ============ -->
  <dialog id="settings">
    <h2>设置</h2>
    <p class="hint">自带 Key 直连 OpenAI 兼容端点。Key 只存在你自己的浏览器里，导出存档时不会包含。</p>

    <div class="field">
      <label for="set-mode">玩法模式</label>
      <select id="set-mode">
        <option value="chat">对话模式（默认）· 与鲸鱼娘自由对话，按节奏出题</option>
        <option value="wordblade">拼单词模式（已遗弃的可选玩法）· 抽字母拼词闯关</option>
      </select>
    </div>
    <div class="field">
      <label for="set-everyn">每几条角色回复出一次题（对话模式）</label>
      <input id="set-everyn" type="number" min="1" max="20" step="1" />
    </div>
    <div class="field">
      <label for="set-qdiff">出题难度（对话模式）</label>
      <select id="set-qdiff">
        <option value="all">全部</option>
        <option value="basic">基础</option>
        <option value="advanced">进阶</option>
      </select>
    </div>
    <div class="field">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="set-rest-enable" style="width:auto" />
        <span>启用休息期（出满一定题数后，连续若干轮只聊天不出题）</span>
      </label>
    </div>
    <div class="field">
      <label for="set-qbefore">每出多少题进入休息期</label>
      <input id="set-qbefore" type="number" min="1" max="100" step="1" />
    </div>
    <div class="field">
      <label for="set-restturns">休息期持续多少轮对话</label>
      <input id="set-restturns" type="number" min="1" max="100" step="1" />
    </div>
    <div class="field">
      <label for="set-facehost">表情图床（两个图床是同一批图，只换取图地址）</label>
      <select id="set-facehost"></select>
    </div>
    <p class="hint" id="facehost-note"></p>

    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0" />

    <div class="field">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="set-limits-enable" style="width:auto" />
        <span>启用上下文与渲染限额（长对话不再无脑全量发送）</span>
      </label>
    </div>
    <div class="field">
      <label for="set-renderlimit">界面渲染消息数（只影响显示）</label>
      <input id="set-renderlimit" type="number" min="10" max="2000" step="10" />
    </div>
    <div class="field">
      <label for="set-historylimit">发送的历史消息上限（条）</label>
      <input id="set-historylimit" type="number" min="2" max="500" step="2" />
    </div>
    <div class="field">
      <label for="set-maxcontext">最大上下文（token，估算）</label>
      <input id="set-maxcontext" type="number" min="1000" max="1000000" step="1000" />
    </div>
    <p class="hint" id="limits-note"></p>

    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0" />

    <div class="field">
      <label for="preset">接口预设</label>
      <select id="preset"></select>
    </div>
    <div class="field">
      <label for="endpoint">接口地址（填 base URL 或完整路径都行）</label>
      <input id="endpoint" placeholder="https://api.deepseek.com/v1" />
    </div>
    <p class="hint" id="endpoint-note"></p>
    <div class="field">
      <label for="model">模型名</label>
      <input id="model" placeholder="deepseek-chat" />
    </div>
    <div class="field">
      <label for="apiKey">API Key（本地端点可留空）</label>
      <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
    </div>
    <div class="field">
      <label for="tier">词汇档位（仅拼单词模式）</label>
      <select id="tier">
        <option value="基础">基础 · 四级核心词汇</option>
        <option value="进阶">进阶 · 高级词汇</option>
      </select>
    </div>
    <div class="field">
      <label for="difficulty">游戏难度（仅拼单词模式）</label>
      <select id="difficulty"></select>
    </div>
    <p class="hint" id="difficulty-note"></p>
    <div class="field">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="usePrefill" style="width:auto" />
        <span>使用预填充（把模型锁进既定输出结构；端点不支持会自动降级）</span>
      </label>
    </div>
    <div class="actions">
      <button id="btn-test" class="ghost">测试连接</button>
      <button id="btn-save-settings" class="primary">保存</button>
      <button id="btn-clear-save" class="ghost">清空存档重开</button>
    </div>
    <p class="hint" id="test-result"></p>
  </dialog>

  <!-- ============ 统计 ============ -->
  <dialog id="stats-dialog">
    <h2>统计</h2>
    <p class="hint" id="bank-info"></p>
    <p class="hint" id="question-bank-info"></p>
    <p class="hint">「最高通过」是该难度下单局最高的通过挑战数；「累计通过」含正在进行的这一局。</p>
    <table class="stats" id="stats-table"></table>
    <div class="actions" style="margin-top:14px">
      <button id="btn-close-stats" class="primary">关闭</button>
      <button id="btn-reset-stats" class="ghost">清空统计</button>
    </div>
  </dialog>

const LETTERS = 'abcdefghijklmnopqrstuvwxyz'.split('');

  k: 8, l: 40, m: 24, n: 67, o: 75, p: 19, q: 1, r: 60, s: 63, t: 91,
  u: 28, v: 10, w: 24, x: 2, y: 20, z: 1,

function lettersOf(word) {
  return String(word)
    .toLowerCase()
    .split('')
    .filter((c) => c >= 'a' && c <= 'z');
}

function multiset(chars) {
  const m = new Map();
  for (const c of chars) m.set(c, (m.get(c) || 0) + 1);
  return m;
}

function unionMultiset(a, b) {
  const m = new Map(a);
  for (const [c, n] of b) m.set(c, (m.get(c) || 0) + n);
  return m;
}

  const out = [];
  for (const [c, n] of m) for (let i = 0; i < n; i += 1) out.push(c);

    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  for (const c of LETTERS) {

    const start = s.indexOf('{');
    const end = s.lastIndexOf('}');
    if (start >= 0 && end > start) {
      try {
        return JSON.parse(s.slice(start, end + 1));
      } catch { /* fallthrough */ }

  const diff = getDifficulty(difficulty);
  return {
    version: SAVE_VERSION,
    runId: runId || `r_${Date.now().toString(36)}`,
    tier,
    difficulty: diff.id,
    sceneIndex: 1,
    outputTurns: 0,
    passedChallenges: 0,
    failures: 0,
    over: false,
    usedWords: [],
    usedScenes: [],
    items: {
      dice: infinite(),
      wildcard: diff.wildcardStart === null ? infinite() : { left: diff.wildcardStart },
    },
    current: null,
    lastScene: null,
    lastVerdict: null,
    history: [],
  };

function difficultyOf(run) {
  return getDifficulty(run?.difficulty);
}

/** 失败上限；null 表示无限。 */
function failureLimitOf(run) {
  return difficultyOf(run).failureLimit;
}

function failuresLeft(run) {
  const limit = failureLimitOf(run);
  if (limit === null) return Infinity;
  return Math.max(0, limit - (run?.failures || 0));
}

function wildcardsLeft(run) {
  const it = run?.items?.wildcard;
  if (!it) return 0;
  return it.left === null ? Infinity : it.left;
}

function isOver(run) {
  return Boolean(run?.over);
}

function itemLeft(run, key) {
  const it = run?.items?.[key];
  if (!it) return 0;
  return it.left === null ? Infinity : it.left;
}

  const left = itemLeft(run, key);
  if (left <= 0) throw new Error(`道具「${key}」已用尽`);
  const items = { ...run.items };
  if (items[key].left !== null) items[key] = { left: items[key].left - 1 };
  return { ...run, items };
}

function grantItem(run, key, n = 1) {
  const it = run.items?.[key];
  if (!it || it.left === null) return run; // 无限额度无需累加
  return { ...run, items: { ...run.items, [key]: { left: it.left + n } } };

    lastScene: scene,
    lastVerdict: null,

  const pool = run.current.pool.tiles.map((t) => t.id);
  if (!pool.includes(tileId)) return run;
  const sel = run.current.selection;

  if (!run.current?.selection.length) return run;

//
// 存储布局（v2）：
//   word-blade:chat-index        顶层索引：当前会话 id + 各会话摘要（小，侧栏直接读它）
//   word-blade:chat-sess:<id>    单个会话的元信息 + 消息 id 列表
//   word-blade:chat-msg:<id>     单条消息（id 全局唯一，天然可跨会话共享）
//
// 为什么这样拆：
//   - 追加消息只写「新消息 + 本会话 key + 顶层索引里那一条摘要」，与会话历史长度脱钩；
//   - 切会话不必读别的会话，侧栏也不必加载任何消息；
//   - 删会话只删它自己的 key 与消息，不牵连其他。
//
// revision 用于多标签页冲突检测：写入前比对顶层索引的 revision 与本次已知值，
// 不一致说明另一个标签页改过，拒绝写入并回报冲突，而不是静默覆盖。
*/

const CHAT_INDEX_KEY = 'word-blade:chat-index';
const CHAT_SESS_PREFIX = 'word-blade:chat-sess:';
const CHAT_MSG_PREFIX = 'word-blade:chat-msg:';

const CHAT_STORE_VERSION = 2;

let knownRevision = null;

function metaOf(session) {
  const { messages, ...meta } = session;
  return meta;
}

function summarize(session) {
  return {
    id: session.id,
    title: session.title,
    updatedAt: session.updatedAt,
    messageCount: session.messages?.length || 0,
  };
}

function readIndex(s) {
  try {
    const raw = s.getItem(CHAT_INDEX_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

function readMessage(s, id) {
  try {
    const raw = s.getItem(CHAT_MSG_PREFIX + id);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

/** 把旧版（单会话：v0 单 key / v1 索引+消息）迁移到 v2 多会话结构。 */
function migrateLegacy(s) {
  let raw = null;
  try {
    raw = s.getItem(CHAT_INDEX_KEY) || s.getItem(CHAT_KEY);
  } catch {
    raw = null;
  }
  if (!raw) return null;
  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch {
    return null;
  }

  // v1 形态：{ version:1, revision, sessionId, meta, messageIds }
  // v0 形态：整个会话对象（含 messages）
  const source = parsed?.meta
    ? { ...parsed.meta, messages: (parsed.messageIds || []).map((id) => readMessage(s, id)).filter(Boolean) }
    : parsed;
  const session = chatFromSaveable(source);
  if (!session) return null;

  try {
    const ids = [];
    for (const m of session.messages) {
      s.setItem(CHAT_MSG_PREFIX + m.id, JSON.stringify(m));
      ids.push(m.id);
    }
    s.setItem(CHAT_SESS_PREFIX + session.id, JSON.stringify({ ...metaOf(session), messageIds: ids }));
    const index = {
      version: CHAT_STORE_VERSION,
      revision: 1,
      currentId: session.id,
      sessions: [summarize(session)],
    };
    s.setItem(CHAT_INDEX_KEY, JSON.stringify(index));
    s.removeItem(CHAT_KEY);
    knownRevision = 1;
    return session;
  } catch {
    return null; // 迁移失败就保留原存档，不硬来
  }
}

    index = readIndex(s);

  knownRevision = index.revision ?? null;
  return { currentId: index.currentId || null, sessions: index.sessions || [] };
}

  if (!s) return null;
  const index = readIndex(s);
  if (!index || index.version !== CHAT_STORE_VERSION) {

    return migrated || null;
  }
  knownRevision = index.revision ?? null;
  const target = id || index.currentId;
  if (!target) return null;

  try {
    const raw = s.getItem(CHAT_SESS_PREFIX + target);
    sess = raw ? JSON.parse(raw) : null;
  } catch {

/**
 * 保存会话。只写新增消息 + 本会话 key + 顶层索引。
 * @returns {{ok:boolean, conflict?:boolean, full?:boolean, error?:string}}
 */
function saveChatSession(session) {
  const s = store();
  if (!s || !session) return { ok: false, error: 'no-storage' };

  let index = readIndex(s);
  if (!index || index.version !== CHAT_STORE_VERSION) {
    migrateLegacy(s);
    index = readIndex(s);
  }
  const prevRevision = index?.revision ?? null;

  if (index && knownRevision !== null && prevRevision !== knownRevision) {
    return { ok: false, conflict: true };
  }

  let prevIds = [];
  try {
    const raw = s.getItem(CHAT_SESS_PREFIX + session.id);
    if (raw) prevIds = JSON.parse(raw)?.messageIds || [];
  } catch { prevIds = []; }
  const written = new Set(prevIds);

  const ids = [];
  try {
    for (const m of session.messages) {
      ids.push(m.id);
      if (written.has(m.id)) continue;
      s.setItem(CHAT_MSG_PREFIX + m.id, JSON.stringify(m));
    }
    // 清理被删掉的消息 key。不做这一步，删消息只会在会话里消失、
    // 存储里却留着孤儿条目，反复删除会持续占用配额。
    const stillHere = new Set(ids);
    for (const oldId of prevIds) {
      if (!stillHere.has(oldId)) s.removeItem(CHAT_MSG_PREFIX + oldId);
    }
    s.setItem(CHAT_SESS_PREFIX + session.id, JSON.stringify({ ...metaOf(session), messageIds: ids }));

    const others = (index?.sessions || []).filter((x) => x.id !== session.id);
    const next = {
      version: CHAT_STORE_VERSION,
      revision: (prevRevision ?? 0) + 1,
      currentId: session.id,
      sessions: [...others, summarize(session)],
    };
    s.setItem(CHAT_INDEX_KEY, JSON.stringify(next));
    knownRevision = next.revision;

    const full = err?.name === 'QuotaExceededError' || /quota/i.test(String(err?.message || ''));

  return { ok: true };

  if (!index || index.version !== CHAT_STORE_VERSION) return false;
  index.currentId = id;
  index.revision = (index.revision ?? 0) + 1;
  try {
    s.setItem(CHAT_INDEX_KEY, JSON.stringify(index));
    knownRevision = index.revision;

/** 删掉一个会话及其全部消息。 */
function deleteChatSession(id) {
  const s = store();
  if (!s || !id) return false;
  const index = readIndex(s);
  if (!index || index.version !== CHAT_STORE_VERSION) return false;
  let messageIds = [];
  try {
    const raw = s.getItem(CHAT_SESS_PREFIX + id);
    if (raw) messageIds = JSON.parse(raw)?.messageIds || [];
  } catch { messageIds = []; }
  try {
    for (const mid of messageIds) s.removeItem(CHAT_MSG_PREFIX + mid);
    s.removeItem(CHAT_SESS_PREFIX + id);
    const rest = index.sessions.filter((x) => x.id !== id);
    index.sessions = rest;
    if (index.currentId === id) index.currentId = rest[0]?.id || null;
    index.revision = (index.revision ?? 0) + 1;
    s.setItem(CHAT_INDEX_KEY, JSON.stringify(index));
    knownRevision = index.revision;
    return true;
  } catch {
    return false;
  }
}

function clearChatSession() {
  const s = store();
  if (!s) return;
  try {
    const index = readIndex(s);
    for (const sess of index?.sessions || []) {
      try {
        const raw = s.getItem(CHAT_SESS_PREFIX + sess.id);
        for (const mid of (raw ? JSON.parse(raw)?.messageIds : []) || []) {

        }
      } catch { /* 单会话损坏不影响整体清理 */ }
      s.removeItem(CHAT_SESS_PREFIX + sess.id);
    }
    s.removeItem(CHAT_INDEX_KEY);
    s.removeItem(CHAT_KEY);
    knownRevision = null;
  } catch { /* ignore */ }
}

/** 供测试与诊断：当前全部会话占用的存储体积估算（字符数）。 */
function chatStorageSize() {
  const s = store();
  if (!s) return 0;
  const index = readIndex(s);
  if (!index) return 0;
  let n = (s.getItem(CHAT_INDEX_KEY) || '').length;
  for (const sess of index.sessions || []) {
    n += (s.getItem(CHAT_SESS_PREFIX + sess.id) || '').length;
  }
  return n;

/**
 * 清扫没有任何会话引用的消息 key。
 * 正常的删除路径已经会即时清掉，但崩溃、中断的写入或旧版本可能留下孤儿条目；
 * 它们只占配额、不影响正确性，所以放在启动时顺手收一次。
 * @returns {number} 清掉的条数
 */
function sweepOrphanMessages() {
  const s = store();

  run = before; // 回滚：技术性失败不计轮数、不计失败、不改手牌、不消耗道具
  setBusy(false);
  toast(describeError(lastErr), { error: true, ms: 7000 });
}

/** 判断这一次通过是否刚好触发万能词奖励（仅用于提示）。 */
function grantedWildcard(after) {
  const every = getDifficulty(after.difficulty).wildcardGrantEvery;
  return Boolean(every) && after.passedChallenges % every === 0;
}

/* ---------------- 统计 ---------------- */

/**
 * 本局结束时自动结算一次统计，并打上 committed 标记防止重复计数
 * （否则刷新页面后再点重开会把同一局算两遍）。
 */
function settleIfOver() {
  if (!run || run.committed || !run.over) return run;
  stats = commitRun(stats, run.difficulty, run);
  saveStats(stats);
  run = { ...run, committed: true };
  saveRun(run);
  return run;
}

/** 主动结算当前这一局（重开、换难度、清档前调用），并打上已结算标记防止重复计数。 */
function commitCurrentRun() {
  if (!run || run.committed) return;
  stats = commitRun(stats, run.difficulty, run);
  saveStats(stats);
  run = { ...run, committed: true };
  saveRun(run);
}

function renderStats() {
  const activeRun = run && !run.committed ? run : null;
  // 词库是按需加载的：聊天模式下大概率还没加载，这时不为了显示一行统计把它拉下来
  if (wordbankMod) {
    const bank = wordbankMod.describeBank();
    $('bank-info').textContent =
      `词库（拼单词模式，已加载）：四级核心 ${bank.total} 词，其中高频（COCA 前 ${bank.hotRankMax} 名）${bank.hot} 词；`
      + `词长 ${bank.minLen}–${bank.maxLen} 字母。`;
  } else {
    $('bank-info').textContent =
      '词库（拼单词模式）：尚未加载。它约 258 KB，只在切到拼单词模式时才按需拉取，'
      + '这样聊天模式的首屏不必为它买单。';
  }
  const qb = describeQuestionBank();
  const types = Object.entries(qb.byType).map(([k, v]) => `${k} ${v}`).join(' / ');
  const diffs = Object.entries(qb.byDifficulty).map(([k, v]) => `${k} ${v}`).join(' / ');
  $('question-bank-info').textContent =
    `题库（对话模式）：${qb.total} 题（${types}；${diffs}），批次 ${qb.id}。`;
  const head = '<tr><th>难度</th><th>最高通过</th><th>累计通过</th><th>已结算局数</th><th>最高输出轮数</th></tr>';
  const rows = DIFFICULTIES.map((d) => {
    const v = viewStats(stats, d.id, activeRun);
    const cls = activeRun && activeRun.difficulty === d.id ? ' class="active"' : '';
    return `<tr${cls}><td>${d.label}</td><td>${v.bestPassed}</td><td>${v.totalPassed}</td><td>${v.runs}</td><td>${v.bestTurns}</td></tr>`;
  }).join('');
  $('stats-table').innerHTML = head + rows;
}

/* ---------------- 交互 ---------------- */

function onToggleTile(tileId) {
  if (busy || !run?.current || run.over) return;
  run = toggleTile(run, tileId);
  render();
}

function onReroll() {
  if (busy || !run?.current || run.over) return;
  try {
    const pool = buildLetterPool(run.current.scene.words.map((w) => w.word));
    run = reroll(run, { pool });
    saveRun(run);
    render();
  } catch (err) {
    toast(err.message, { error: true });
  }
}

async function restartRun() {
  commitCurrentRun();
  run = createRun({ tier: run?.tier || '基础', difficulty: run?.difficulty || DEFAULT_DIFFICULTY });
  saveRun(run);
  render();
  await advance();
}

/** 边填边显示「最终会请求哪个地址」，让归一化可见而不是魔法。 */
function showEndpointNote() {
  const raw = $('endpoint').value.trim();
  const note = $('endpoint-note');
  if (!raw) {
    note.textContent = '';
    return;
  }
  const url = normalizeEndpoint(raw);
  if (url === raw.replace(/\/+$/, '')) {
    note.textContent = `将请求：${url}`;
  } else {
    note.textContent = `已自动补全 → 将请求：${url}`;
  }
}

function clampInt(raw, min, max, fallback) {
  const n = Math.round(Number(raw));
  if (!Number.isFinite(n)) return fallback;
  return Math.min(max, Math.max(min, n));
}

function clampEveryN(raw) {
  return clampInt(raw, 1, 20, DEFAULT_EVERY_N);
}

function initSettings() {
  const preset = $('preset');
  preset.replaceChildren(...PROFILE_PRESETS.map((p) => {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = p.label;

  }));

      $('model').value = p.model;

    }
  });

  fillDifficultySelect();
  fillFaceHostSelect();
  $('difficulty').addEventListener('change', showDifficultyNote);
  $('set-facehost').addEventListener('change', showFaceHostNote);
  for (const id of ['set-limits-enable', 'set-renderlimit', 'set-historylimit', 'set-maxcontext']) {
    $(id).addEventListener('change', showLimitsNote);
  }
  $('endpoint').addEventListener('input', showEndpointNote);

  $('btn-test').addEventListener('click', async () => {
    const out = $('test-result');
    out.textContent = '正在测试…';
    try {
      const r = await probe({
        endpoint: $('endpoint').value.trim(),
        model: $('model').value.trim(),
        apiKey: $('apiKey').value.trim(),
      });
      out.textContent = `连接成功。模型返回：${r.preview}`;
    } catch (err) {
      out.textContent = `连接失败：${describeError(err)}`;
    }
  });

  $('btn-save-settings').addEventListener('click', async () => {
    profile = {
      endpoint: $('endpoint').value.trim(),
      model: $('model').value.trim(),
      apiKey: $('apiKey').value.trim(),
      usePrefill: $('usePrefill').checked,
    };
    saveProfile(profile);

    // 表情图床（两个图床同一批图，切换只换取图地址）
    faceHost = FACE_HOSTS.some((h) => h.id === $('set-facehost').value)
      ? $('set-facehost').value
      : DEFAULT_FACE_HOST;
    saveFaceHost(faceHost);

    // 对话模式参数
    if (session) {
      session = {
        ...session,
        everyN: clampEveryN($('set-everyn').value),
        difficulty: $('set-qdiff').value || 'all',
        restConfig: {
          enabled: $('set-rest-enable').checked,
          questionsBeforeRest: clampInt($('set-qbefore').value, 1, 100, DEFAULT_REST.questionsBeforeRest),
          restTurns: clampInt($('set-restturns').value, 1, 100, DEFAULT_REST.restTurns),
        },
        limits: clampLimits({
          enabled: $('set-limits-enable').checked,
          renderLimit: $('set-renderlimit').value,
          historyLimit: $('set-historylimit').value,
          maxContextTokens: $('set-maxcontext').value,
          trimRatio: session.limits?.trimRatio ?? DEFAULT_LIMITS.trimRatio,
        }),
      };
      // 改了「每几题休息」就重置本周期计数，避免刚改完就立刻触发或永远不触发
      session.questionsSinceRest = Math.min(session.questionsSinceRest, session.restConfig.questionsBeforeRest - 1);
      saveChatSession(session);
    }

    // 玩法模式切换
    const nextMode = $('set-mode').value === MODES.wordblade ? MODES.wordblade : MODES.chat;
    const modeChanged = nextMode !== mode;
    mode = nextMode;
    saveMode(mode);

    // 拼单词模式的档位
    const tier = $('tier').value;
    const difficulty = $('difficulty').value;
    const runChanged = run && (tier !== run.tier || difficulty !== run.difficulty);
    if (runChanged) {
      commitCurrentRun();
      run = createRun({ tier, difficulty });
      saveRun(run);
    }

    $('settings').close();
    applyMode();
    if (mode === MODES.wordblade) {
      if (modeChanged || runChanged) { await bootWordblade(); } else if (!run.current && !run.over) { await advance(); }
    } else {
      renderChat();
    }
  });

  $('btn-clear-save').addEventListener('click', async () => {
    commitCurrentRun();
    clearRun();
    clearChatSession();
    run = createRun({ tier: $('tier').value || '基础', difficulty: $('difficulty').value || DEFAULT_DIFFICULTY });
    saveRun(run);
    session = createSession({
      profile: userProfile,
      everyN: clampEveryN($('set-everyn').value),
      difficulty: $('set-qdiff').value || 'all',
    });
    saveChatSession(session);
    $('settings').close();
    applyMode();
    if (mode === MODES.wordblade) {
      render();
      await advance();
    } else {
      renderChat();
      chatToast('对话已清空，从头再聊一次');
    }
  });
}

/* ---------------- 错误提示 ---------------- */

function describeError(err) {
  if (err instanceof RetryableError) {
    const map = {
      'no-key': '还没有填写 API Key，点右上角「设置」',
      'no-endpoint': '还没有配置模型接口地址',
      network: '连不上这个地址。检查接口地址是否正确、是否需要代理；如果页面是 https 而接口是 http，浏览器会直接拦掉',
      timeout: '请求超时。场景较长时出题会比较慢，可以重试或换更快的模型',
      http: '接口返回了错误。常见原因：Key 不对、模型名写错、余额不足、该端点不允许浏览器直连（CORS）',
      'not-json': '接口返回的不是 JSON，通常说明地址填的是网页而不是 API 端点',
      empty: '模型没有返回内容，可以重试',
      schema: '模型返回的字段不符合协议（多为漏字段），已自动重试',
      contradiction: '模型返回的字段自相矛盾，已自动重试',
    };
    return map[err.kind] || `模型调用失败：${err.message}`;
  }
  return err?.message || String(err);
}

/* ---------------- 启动 ---------------- */

/* ================= 对话模式（一期：单会话） ================= */

/** 端点与 Key 是否就绪。判定逻辑来自网关，此处不再自己写一份。 */
function hasModel() {
  return modelReadiness(profile).ready;
}

/**
 * 推进历史窗口。只在超预算时才裁（滞后），两次裁剪之间窗口起点不动，
 * 这样系统提示词之后的前缀保持字节稳定，前缀缓存才吃得满。
 */
function advanceWindow(currentSession, systemText) {
  const u = totalUsage(currentSession);
  const lastReal = u.turns ? u.prompt : null;
  const sysTokens = systemTokensFor({
    systemText,
    lastRealPromptTokens: lastReal,
    lastHistoryEstimate: currentSession.messages.length ? estimateFrom(currentSession.messages, currentSession.trimCursor || 0) : null,
  });
  const plan = nextTrimCursor({
    messages: currentSession.messages,
    systemTokens: sysTokens,
    cursor: currentSession.trimCursor || 0,
    limits: currentSession.limits,
  });
  return {
    session: { ...currentSession, trimCursor: plan.cursor },
    plan,
    systemTokens: sysTokens,
  };
}

/** 落盘并把冲突/配额问题报给用户，不让它静默失败。 */
function persistSession(next) {
  const r = saveChatSession(next);
  if (r.ok) return next;
  if (r.conflict) {
    chatToast('另一个标签页改动了这段对话，为避免覆盖，本次没有保存。刷新页面后再继续。', { error: true, ms: 9000 });
  } else if (r.full) {
    chatToast('本地存储已满，本次没有保存。去设置里调小「发送的历史消息上限」或清空存档重开。', { error: true, ms: 9000 });
  } else {
    chatToast(`保存失败：${r.error || '未知原因'}`, { error: true, ms: 7000 });
  }
  return next;
}

function applyMode() {
  const isChat = mode === MODES.chat;
  // chat 模式下锁死页面高度，让滚轮落在对话区内部而不是整页
  document.body.classList.toggle('chat-mode', isChat);
  $('view-chat').classList.toggle('hidden', !isChat);
  $('view-wordblade').classList.toggle('hidden', isChat);
  $('hud-chat-group').classList.toggle('hidden', !isChat);
  $('hud-wordblade-group').classList.toggle('hidden', isChat);
  // 侧栏切换按钮只在窄屏有意义，宽屏侧栏常驻
  $('btn-side').classList.toggle('hidden', !isChat || window.innerWidth > 860);
}

function renderChat() {
  // 侧栏从索引读取会话摘要（不含消息），所以切会话/列列表都不必加载历史
  const list = loadSessionList();
  renderSessionList({
    hostEl: $('session-list'),
    sessions: list.sessions,
    currentId: session?.id || list.currentId,
    onSelect: switchSession,
    onNew: newSession,
    onDelete: removeSession,
  });

  renderThread({
    hostEl: $('chat-thread'),
    session,
    busy: chatBusy,
    onRegenerate: regenerateLast,
    onDeleteMessage: removeMessage,
    faceFor,
  });
  const replies = session ? assistantReplyCount(session) : 0;
  $('hud-chat-turns').textContent = String(replies);
  $('hud-chat-mode').textContent = '对话';
  const until = repliesUntilNext({ assistantReplyCount: replies, everyN: session?.everyN });
  $('hud-chat-until').textContent = until === null ? '关' : String(until);

  // 休息期状态
  const rest = restLabel(session);
  $('hud-chat-rest').textContent = rest.text;
  $('hud-chat-rest').classList.toggle('resting', rest.resting);

  // 会话累计 token：只统计拿到用量的轮次；缓存命中率只在端点报过缓存字段时才算
  const u = session ? totalUsage(session) : { total: 0, turns: 0, cacheHitRate: null };
  if (u.turns) {
    const base = `${u.total.toLocaleString('en-US')}（${u.turns} 轮`;
    const rate = u.cacheHitRate === null ? '' : `，缓存命中 ${Math.round(u.cacheHitRate * 100)}%`;
    $('hud-chat-tokens').textContent = `${base}${rate}）`;
  } else {
    $('hud-chat-tokens').textContent = '—';
  }

  $('btn-chat-send').disabled = chatBusy;
  $('btn-chat-send').textContent = chatBusy ? '…' : '发送';
}

/**
 * 清单里的「来源」→ 浏览器能取的地址。
 * 本地资产要过一层映射表（单文件版把它换成内联 data URL）；远程地址原样用。
 */
function mediaUrlFor(src) {
  if (!src?.path) return '';
  return src.type === 'local' ? localMediaUrl(src.path) : src.path;
}

/**
 * 把一条角色回复解析成要点缀的表情。
 * 地址在这里才定（要用当前图床），渲染层只收结果——换图床重渲染整条消息才会变。
 * 认不出的标签与缺图的标签都返回 null，界面就不贴图，绝不贴一张错的。
 * @returns {{emotion:string, src:{path:string}}|null}
 */
function faceFor(text) {
  const r = resolveFace(ASSET_MANIFEST, lastFace(text), { host: faceHost });
  const path = mediaUrlFor(r?.src);
  return path ? { emotion: r.emotion, src: { path } } : null;
}

/**
 * 对话背景。底图是清单里的 bg 资产，走 cover 铺满，交给 CSS 缩放。
 * 这里只把地址写进 CSS 变量，尺寸与压暗全在样式里，改版不用动 JS。
 */
function applyChatBackground() {
  const src = resolveAsset(ASSET_MANIFEST, { kind: 'bg' })?.asset?.source;
  const path = mediaUrlFor(src);
  // 地址可能来自清单，虽然是自己写的，仍按不可信处理：只拼进 url() 并转义引号
  document.documentElement.style.setProperty(
    '--chat-bg',
    path ? `url("${path.replace(/["\\]/g, '\\$&')}")` : 'none',
  );
}

function setChatBusy(v) {
  chatBusy = v;
  renderChat();
}

function bootChat() {
  // 启动时顺手收掉无引用的消息条目（崩溃或旧版本可能留下）
  sweepOrphanMessages();
  session = loadChatSession();
  if (!session) {
    session = createSession({ profile: userProfile, everyN: DEFAULT_EVERY_N, difficulty: 'all' });
    persistSession(session);
  }
  // 已有档案就统一注入到当前会话（会话自带档案时以会话为准）
  if (session.profile) userProfile = normalizeProfile(session.profile) || userProfile;
  else if (userProfile) {
    session = { ...session, profile: userProfile };
    persistSession(session);
  }

  renderChat();

  if (!profileComplete(userProfile)) {
    openProfile({ firstTime: true });
    return;
  }
  if (!hasModel()) {
    chatToast('还没配置模型端点，先点右上角「设置」');
  }
}

/**
 * 发送。按钮不是直接发送——先由代码判断这一轮要不要插题：
 * 需要插题就抽一道，把题目与用户消息拼成一段文本，题目用 <Question> 包裹。
 * 对错由模型在对话里判断（按驾驶员确认），代码不判。
 */
async function sendChat() {
  if (chatBusy) return;
  if (!profileComplete(userProfile)) {
    openProfile({ firstTime: true });
    return;
  }
  if (!hasModel()) {
    chatToast('先配置模型端点和 Key', { error: true });
    openSettings();
    return;
  }
  const input = $('chat-input');
  const text = input.value.trim();
  if (!text) {
    chatToast('先说点什么吧');
    return;
  }

  setChatBusy(true);

  // 1) 代码决定这一轮是否插题（含休息期判断），并推进休息状态
  const replies = assistantReplyCount(session);
  const plan = planInjection({ assistantReplyCount: replies, everyN: session.everyN, session });
  session = applyRestState(session, plan.next);

  let question = null;
  if (plan.inject) {
    try {
      question = drawQuestion({ session, difficulty: session.difficulty });
    } catch (err) {
      chatToast(`抽题失败：${err.message}`, { error: true });
    }
  }

  // 2) 落一条用户消息：只存原文 + 题目 id（题目本身不显示在用户气泡里）
  session = appendMessage(session, { role: 'user', text, questionId: question?.id || null });
  if (question) session = markQuestionUsed(session, question.id);
  session = renameSession(session, deriveTitle(session));
  persistSession(session);
  input.value = '';
  renderChat();

  // 3) 请模型回应（含历史窗口推进）
  await generateReply();

  setChatBusy(false);
}

/**
 * 请模型对「当前会话末尾那条用户消息」作出回应。
 * 正常发送与「重新生成」都走这里，避免两份实现。
 */
async function generateReply() {
  try {
    const system = buildChatSystem(session.profile, { emotionList: emotionPromptList() });
    const { session: withWindow } = advanceWindow(session, system);
    session = withWindow;
    const messages = buildChatMessages(session, system, { cursor: session.trimCursor || 0 });
    const { text: reply, usage } = await callText(
      { endpoint: profile.endpoint, model: profile.model, apiKey: profile.apiKey },
      { messages },
    );
    session = appendMessage(session, { role: 'assistant', text: reply, usage });
    persistSession(session);
    return true;
  } catch (err) {
    chatToast(describeError(err), { error: true, ms: 8000 });
    return false;
  }
}

/**
 * 重新生成：末尾那条用户消息没有被回应时（超时、断网、页面被关），
 * 不用重打一遍字，直接再请一次模型。
 */
async function regenerateLast() {
  if (chatBusy) return;
  if (!hasModel()) {
    chatToast('先配置模型端点和 Key', { error: true });
    openSettings();
    return;
  }
  const last = session?.messages?.[session.messages.length - 1];
  if (!last || last.role !== 'user') {
    chatToast('末尾没有待回应的消息');
    return;
  }
  setChatBusy(true);
  await generateReply();
  setChatBusy(false);
}

/* ---------------- 多会话 ---------------- */

/** 新建会话。已填过档案就沿用它，省得每次重填。 */
function newSession() {
  if (chatBusy) return;
  session = createSession({
    profile: userProfile,
    everyN: session?.everyN ?? DEFAULT_EVERY_N,
    difficulty: session?.difficulty ?? 'all',
    restConfig: session?.restConfig,
    limits: session?.limits,
  });
  persistSession(session);
  renderChat();
  chatToast('新开了一段对话');
}

function switchSession(id) {
  if (chatBusy || !id) return;
  if (session?.id === id) {
    $('view-chat').classList.remove('side-open');
    return;
  }
  persistSession(session); // 先把当前这段落盘
  const next = loadChatSession(id);
  if (!next) {
    chatToast('这个对话读不出来了', { error: true });
    return;
  }
  session = next;
  setCurrentSession(id);
  $('view-chat').classList.remove('side-open');
  renderChat();
}

function removeSession(id) {
  if (chatBusy || !id) return;
  const wasCurrent = session?.id === id;
  deleteChatSession(id);
  if (wasCurrent) {
    const list = loadSessionList();
    session = list.currentId ? loadChatSession(list.currentId) : null;
    if (!session) {
      session = createSession({ profile: userProfile });
      persistSession(session);
    }
  }
  renderChat();
  chatToast('对话已删除');
}

function removeMessage(id) {
  if (chatBusy) return;
  session = deleteMessage(session, id);
  persistSession(session);
  renderChat();
}

/* ---------------- user 档案 ---------------- */

let profileFirstTime = false;

function openProfile({ firstTime = false } = {}) {
  profileFirstTime = firstTime;
  fillProfileForm({
    nameEl: $('pf-name'),
    genderEl: $('pf-gender'),
    customEl: $('pf-custom'),
    customWrap: $('pf-custom-wrap'),
    profile: userProfile,
  });
  $('pf-error').textContent = '';
  $('btn-pf-save').textContent = firstTime ? '开始对话' : '保存';
  $('profile-dialog').showModal();
  $('pf-name').focus();
}

function initProfileDialog() {
  $('pf-gender').addEventListener('change', () => syncCustomVisibility({
    genderEl: $('pf-gender'), customWrap: $('pf-custom-wrap'),
  }));

  $('btn-pf-save').addEventListener('click', () => {
    const err = profileFormError({ nameEl: $('pf-name'), genderEl: $('pf-gender'), customEl: $('pf-custom') });
    if (err) {
      $('pf-error').textContent = err;
      return;
    }
    const raw = readProfileForm({ nameEl: $('pf-name'), genderEl: $('pf-gender'), customEl: $('pf-custom') });
    userProfile = normalizeProfile(createProfile(raw));
    saveUserProfile(userProfile);
    if (session) {
      session = { ...session, profile: userProfile };
      saveChatSession(session);
    }
    $('profile-dialog').close();
    renderChat();
    if (profileFirstTime && session && !session.messages.length) {
      chatToast(`好，从今往后她就叫你「${userProfile.name}」了`);
    }
  });

  $('btn-profile').addEventListener('click', () => openProfile());
}

/* ================= 启动 ================= */

async function bootWordblade() {
  run = loadRun() || createRun({ tier: '基础', difficulty: DEFAULT_DIFFICULTY });
  render();

  if (run.over) {
    commitCurrentRun();
    render();
    return;
  }
  if (!hasModel()) {
    toast('先填写 API Key 才能开始出题');
    openSettings();
    return;
  }
  if (!run.current) await advance();
}

async function boot() {
  initSettings();
  initStats();
  initProfileDialog();

  profile = loadProfile() || emptyProfile();
  stats = loadStats();
  userProfile = loadUserProfile();
  mode = loadMode();
  faceHost = loadFaceHost();
  applyChatBackground();

  // 共用按钮
  $('btn-settings').addEventListener('click', openSettings);

  // 拼单词模式的按钮：只在对应模式下生效
  $('btn-submit').addEventListener('click', () => {
    if (mode !== MODES.wordblade) return;
    if (busy || run?.over) return;
    if (!run.current) advance();
    else submit();
  });
  $('btn-restart').addEventListener('click', () => { if (mode === MODES.wordblade) restartRun(); });
  $('btn-undo').addEventListener('click', () => { if (mode === MODES.wordblade) { run = undoSelection(run); render(); } });
  $('btn-clear').addEventListener('click', () => { if (mode === MODES.wordblade) { run = clearSelection(run); render(); } });
  $('btn-dice').addEventListener('click', () => { if (mode === MODES.wordblade) onReroll(); });
  $('btn-wildcard').addEventListener('click', () => { if (mode === MODES.wordblade) submitWildcard(); });

  // 对话模式的按钮
  $('btn-chat-send').addEventListener('click', sendChat);
  $('btn-side').addEventListener('click', () => $('view-chat').classList.toggle('side-open'));
  $('chat-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendChat();
    }
  });

  applyMode();

  if (!storageAvailable()) {
    chatToast('当前环境无法使用本地存储，对话不会保存', { error: true, ms: 6000 });
  }

  if (mode === MODES.wordblade) await bootWordblade();
  else bootChat();
}

boot();
  });

  __req("src/main.js");
})();
  </script>
